[package]
name = "lineal"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A lightweight, modern terminal web browser written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/Zexolver/lineal-browser"
readme = "README.md"
keywords = ["browser", "terminal", "tui", "web", "ratatui"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = { version = "0.27", default-features = false }
url = "2.5"
unicode-width = "0.2"
encoding_rs = "0.8.42"
html5ever = "0.39"
ego-tree = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
