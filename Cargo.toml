[package]
name = "lineal"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A lightweight, modern terminal web browser written in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/Zexolver/lineal-browser"
readme = "README.md"
keywords = ["browser", "terminal", "tui", "web", "ratatui"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "cookies", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5"
unicode-width = "0.2"
encoding_rs = "0.8.42"
# Rendering engine: Blitz = Stylo (Firefox's CSS engine) + Taffy layout + Parley text.
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["system-fonts"] }
blitz-html = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
blitz-paint = { version = "=0.3.0-beta.2", default-features = false }
anyrender = "0.13"
anyrender_vello_cpu = "0.17"
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
peniko = "0.6"
kurbo = "0.13"
keyboard-types = "0.7"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
